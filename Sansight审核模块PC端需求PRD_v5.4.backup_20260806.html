<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sansight 审核模块 PC 端需求 PRD v5.4 - 原型</title>
<style>
  :root{
    --primary:#C6000B;
    --primary-bg:#FFE8E6;
    --link:#2563EB;
    --text:rgba(5,12,50,.85);
    --text-2:rgba(5,12,50,.6);
    --text-3:rgba(5,12,50,.38);
    --border:#E9EBEF;
    --head:#F5F5F5;
    --bg:#F5F6F8;
    --orange:#FA8C16;
    --green:#27AE60;
    --gray:#8C8C8C;
    --shadow:0 2px 10px rgba(5,12,50,.06);
    --radius:4px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);
    background:var(--bg);
    font-size:14px;
    letter-spacing:0;
    overflow:hidden;
  }
  button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
  input,select,textarea{font-family:inherit;font-size:13px;color:var(--text)}
  input:focus,textarea:focus,button:focus{outline:none}
  svg{display:block}
  .icon{width:18px;height:18px;flex:none}
  .icon.sm{width:15px;height:15px}
  .icon.lg{width:20px;height:20px}
  .app{display:flex;flex-direction:column;height:100vh;min-width:1280px}

  /* ---------- Top bar ---------- */
  .topbar{
    height:52px;flex:none;display:flex;align-items:center;justify-content:space-between;
    padding:0 16px;background:#fff;border-bottom:1px solid var(--border);z-index:20;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:216px}
  .brand .logo{width:28px;height:28px;border-radius:6px;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff}
  .brand .name{font-size:16px;font-weight:600}
  .brand .ver{font-size:12px;color:var(--text-2);background:var(--head);border:1px solid var(--border);border-radius:10px;padding:1px 8px}
  .top-actions{display:flex;align-items:center;gap:10px}
  .lang-menu,.user-menu{display:flex;align-items:center;gap:6px;height:34px;padding:0 10px;border-radius:var(--radius);cursor:pointer;font-size:13px;color:var(--text)}
  .lang-menu:hover,.user-menu:hover{background:var(--head)}
  .caret-mini{display:inline-flex;color:var(--text-3)}
  .caret-mini svg{width:14px;height:14px}
  .tenant-name{font-size:13px;color:var(--text-2);padding-right:12px;border-right:1px solid var(--border)}
  .icon-btn{
    width:34px;height:34px;border-radius:var(--radius);display:inline-flex;align-items:center;justify-content:center;
    color:var(--text-2);position:relative;
  }
  .icon-btn:hover{background:var(--head);color:var(--text)}
  .avatar{
    width:32px;height:32px;border-radius:50%;background:var(--primary-bg);color:var(--primary);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;
  }

  /* ---------- Workspace ---------- */
  .workspace{flex:1;display:flex;min-height:0;position:relative}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:216px;flex:none;background:#fff;border-right:1px solid var(--border);
    overflow-y:auto;padding:10px 8px;
  }
  .nav-group{margin-bottom:2px}
  .nav-item{
    display:flex;align-items:center;gap:9px;height:38px;padding:0 10px;border-radius:var(--radius);
    color:var(--text);font-size:13.5px;cursor:pointer;user-select:none;white-space:nowrap;
  }
  .nav-item:hover{background:var(--head)}
  .nav-item .label{flex:1;overflow:hidden;text-overflow:ellipsis}
  .nav-item .arrow{transition:transform .15s;color:var(--text-3)}
  .nav-item.open .arrow{transform:rotate(90deg)}
  .nav-item.active{background:var(--primary-bg);color:var(--primary);font-weight:600}
  .nav-children{overflow:hidden;height:0;transition:height .18s ease}
  .nav-children.open{height:auto}
  .nav-child{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 34px;color:var(--text-2);font-size:13px;cursor:pointer;border-radius:var(--radius)}
  .nav-child:hover{color:var(--text);background:var(--head)}
  .nav-child.active{color:var(--primary);background:var(--primary-bg);font-weight:600}
  .nav-divider{height:1px;background:var(--border);margin:8px 6px}

  /* ---------- Middle dashboard ---------- */
  .middle{
    width:272px;flex:none;background:#fff;border-right:1px solid var(--border);
    display:flex;flex-direction:column;min-height:0;
  }
  .middle-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px}
  .middle-title{font-size:16px;font-weight:600}
  .board-meta{
    display:flex;align-items:center;gap:8px;padding:0 16px 12px;color:var(--text-2);font-size:12px;
  }
  .board-meta .dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex:none}
  .board-meta .refresh{margin-left:auto;width:28px;height:28px}
  .category-list{flex:1;padding:0 10px;overflow-y:auto}
  .category-item{
    display:flex;align-items:center;gap:10px;height:46px;padding:0 12px;border-radius:var(--radius);
    cursor:pointer;color:var(--text);font-size:14px;margin-bottom:4px;border:1px solid transparent;
  }
  .category-item:hover{background:var(--head)}
  .category-item.active{background:var(--primary-bg);color:var(--primary);font-weight:600;border-color:rgba(198,0,11,.15)}
  .category-item .count{margin-left:auto}
  .badge{min-width:20px;height:20px;border-radius:10px;background:var(--primary);color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;font-weight:500}
  .badge.zero{background:var(--head);color:var(--text-3)}

  /* ---------- Main ---------- */
  .main{flex:1;min-width:0;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:14px}
  .view{display:flex;flex-direction:column;gap:14px;min-height:0}
  .view[hidden]{display:none}
  .detail-panel{
    position:absolute;top:0;right:0;bottom:0;z-index:40;width:560px;flex:none;
    background:#fff;border-left:1px solid var(--border);box-shadow:-10px 0 28px rgba(5,12,50,.10);
    display:flex;flex-direction:column;min-height:0;overflow:hidden;
  }
  .detail-panel[hidden]{display:none}
  .panel-view{display:flex;flex-direction:column;flex:1;min-height:0}
  .panel-view[hidden]{display:none}
  .detail-asset{display:flex;align-items:center;gap:10px;padding:12px 18px;background:#FAFBFC;flex:none}
  .panel-mask{position:absolute;top:0;left:0;right:0;bottom:0;z-index:30;background:rgba(5,12,50,.32)}
  .panel-mask[hidden]{display:none}
  .detail-head .detail-close{margin-left:auto}

  .page-head{display:flex;align-items:center;gap:14px}
  .page-title{font-size:18px;font-weight:600}
  .page-sub{color:var(--text-2);font-size:13px}
  .page-actions{margin-left:auto;display:flex;align-items:center;gap:10px}

  /* mode switch */
  .mode-switch{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2)}
  .switch{
    width:36px;height:20px;border-radius:10px;background:#C7CBD4;position:relative;transition:background .15s;
  }
  .switch::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .switch.on{background:var(--primary)}
  .switch.on::after{left:18px}

  /* filter row */
  .filter-row{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--border);
    border-radius:var(--radius);padding:10px 12px;
  }
  .filter-item{display:flex;align-items:center;gap:8px}
  .filter-item .f-label{font-size:13px;color:var(--text-2);flex:none}
  .filter-search{position:relative;width:200px}
  .filter-search .icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text-3)}
  .filter-search input{width:100%;height:34px;border:1px solid var(--border);border-radius:var(--radius);padding:0 10px 0 32px;background:#fff}
  .dropdown{position:relative}
  .dropdown-trigger{
    display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 10px;border:1px solid var(--border);
    border-radius:var(--radius);background:#fff;font-size:13px;min-width:118px;justify-content:space-between;color:var(--text);
  }
  .dropdown-trigger:hover{border-color:#C7CBD4}
  .dropdown-trigger .caret{color:var(--text-3);transition:transform .15s}
  .dropdown.open .caret{transform:rotate(180deg)}
  .dropdown-menu{
    position:absolute;top:40px;left:0;min-width:220px;background:#fff;border:1px solid var(--border);
    border-radius:var(--radius);box-shadow:var(--shadow);padding:6px;z-index:50;display:none;
  }
  .dropdown.open .dropdown-menu{display:block}
  .detail-panel .dropdown-menu{top:auto;bottom:calc(100% + 6px)}
  .menu-opt{
    display:flex;align-items:center;gap:8px;height:34px;padding:0 8px;border-radius:var(--radius);cursor:pointer;font-size:13px;
  }
  .menu-opt:hover{background:var(--head)}
  .menu-opt .check{width:16px;height:16px;border:1px solid #C7CBD4;border-radius:3px;flex:none;display:inline-flex;align-items:center;justify-content:center;color:#fff}
  .menu-opt.on .check{background:var(--primary);border-color:var(--primary)}
  .menu-opt.on{color:var(--primary)}
  .menu-sep{height:1px;background:var(--border);margin:5px 4px}
  .menu-clear{display:flex;align-items:center;justify-content:center;gap:6px;height:30px;margin:0 4px 6px;border:1px dashed var(--border);border-radius:var(--radius);font-size:12.5px;color:var(--text-2);cursor:pointer}
  .menu-clear:hover{color:var(--primary);border-color:var(--primary);background:var(--primary-bg)}
  .date-range{padding:8px;display:flex;flex-direction:column;gap:8px;min-width:280px}
  .date-range .dr-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2)}
  .date-range .dr-row .dr-label{flex:none;width:56px}
  .date-range input[type="date"]{height:32px;border:1px solid var(--border);border-radius:var(--radius);padding:0 8px;flex:1;color:var(--text);background:#fff;min-width:0}
  .date-range input[type="date"]:focus{border-color:var(--primary)}
  .date-range .dr-actions{display:flex;justify-content:flex-end;gap:8px;padding-top:2px}
  .btn-reset{height:34px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;font-size:13px;color:var(--text)}
  .btn-reset:hover{color:var(--primary);border-color:var(--primary)}
  .filter-count{font-size:12px;color:var(--text-3)}

  /* table */
  .table-wrap{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .table-head,.group-row,.event-row{display:grid;align-items:center}
  .grid-cols{grid-template-columns:36px 180px 130px minmax(220px,1fr) 150px 110px 110px 92px 84px 150px 150px}
  .grid-cols.simple{grid-template-columns:36px 200px 130px minmax(220px,1fr) 150px 110px 110px 92px 84px 150px 150px}
  .table-head{
    grid-template-columns:36px 200px 130px minmax(220px,1fr) 150px 110px 110px 92px 84px 150px 150px;
    background:var(--head);font-size:12.5px;color:var(--text-2);height:42px;padding:0 12px;border-bottom:1px solid var(--border);
  }
  .table-head .th{display:flex;align-items:center;gap:5px;white-space:nowrap}
  .table-body{max-height:calc(100vh - 330px);overflow-y:auto}
  .group-row{
    grid-template-columns:36px 200px minmax(120px,1fr) 120px 120px 60px;
    height:58px;padding:0 12px;border-bottom:1px solid #F0F1F4;cursor:pointer;transition:background .12s;
  }
  .group-row:hover{background:#FAFBFC}
  .group-row.open{background:#FFF7F6}
  .group-row .chev{transition:transform .15s;color:var(--text-3)}
  .group-row.open .chev{transform:rotate(90deg)}
  .asset-cell{display:flex;align-items:center;gap:10px;min-width:0}
  .asset-thumb{width:40px;height:40px;border-radius:var(--radius);background:var(--head);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-3);flex:none}
  .asset-info{min-width:0}
  .asset-name{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .asset-type{font-size:12px;color:var(--text-2);margin-top:2px}
  .event-count{font-size:13px}
  .event-count b{color:var(--primary);font-size:15px;margin-right:4px}
  .meter{font-size:12.5px;color:var(--text-2)}
  .event-row{
    grid-template-columns:36px 200px 130px minmax(220px,1fr) 150px 110px 110px 92px 84px 150px 150px;
    min-height:54px;padding:8px 12px;border-bottom:1px solid #F5F6F8;cursor:pointer;transition:background .12s;
  }
  .event-row:hover{background:#FAFBFC}
  .event-row .cell{min-width:0;font-size:13px}
  .event-row .cell.sub{color:var(--text-2)}
  .event-type{font-weight:500}
  .event-content{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-2)}
  .tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:500}
  .tag.pending{background:#FFF1E8;color:var(--orange)}
  .tag.done{background:#E8F7EE;color:var(--green)}
  .tag.ignored{background:#F0F1F4;color:var(--gray)}
  .row-actions{display:flex;align-items:center;gap:4px}
  .link-btn{height:28px;padding:0 8px;border-radius:var(--radius);font-size:12.5px;color:var(--link);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .link-btn:hover{background:rgba(37,99,235,.08)}
  .link-btn.danger{color:var(--primary)}
  .link-btn.danger:hover{background:var(--primary-bg)}
  .link-btn.ghost{color:var(--text-2)}
  .link-btn.ghost:hover{background:var(--head);color:var(--text)}
  .load-more{display:flex;justify-content:center;padding:10px 0}
  .btn-more{height:32px;padding:0 14px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;font-size:13px;color:var(--link)}
  .btn-more:hover{border-color:var(--link)}
  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:60px 0;color:var(--text-3)}

  /* ---------- Detail view ---------- */
  .detail-layout{display:flex;gap:14px;flex:1;min-height:0}
  .detail-left{width:280px;flex:none;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px}
  .detail-left .d-title{font-size:14px;font-weight:600;margin-bottom:14px}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #F3F4F7;font-size:13px}
  .kv:last-child{border-bottom:none}
  .kv .k{color:var(--text-2);flex:none}
  .kv .v{text-align:right;word-break:break-all}
  .status-online{color:var(--green);display:inline-flex;align-items:center;gap:5px}
  .status-online::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green)}
  .detail-right{flex:1;min-width:0;background:#fff;border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden}
  .detail-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border);flex:none}
  .detail-title{font-size:16px;font-weight:600}
  .tabs{display:flex;gap:4px;padding:0 18px;border-bottom:1px solid var(--border)}
  .tab{padding:12px 4px;margin-right:18px;font-size:14px;color:var(--text-2);cursor:pointer;border-bottom:2px solid transparent}
  .tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
  .detail-body{flex:1;min-height:0;overflow-y:auto;padding:18px}
  .detail-section{margin-bottom:20px}
  .detail-section .sec-title{font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:10px;display:flex;align-items:center;gap:6px}
  .detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 24px;background:#FAFBFC;border:1px solid #F0F1F4;border-radius:var(--radius);padding:6px 16px}
  .kv2{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed #E8EAEE;font-size:13px}
  .kv2:nth-last-child(-n+2){border-bottom:none}
  .kv2 .k{color:var(--text-2);flex:none}
  .kv2 .v{text-align:right}
  .alert-box{display:flex;gap:10px;background:#FFF7E6;border:1px solid #FFE3A6;border-radius:var(--radius);padding:12px 14px;font-size:13px;color:#AD6800}
  .alert-box .icon{color:#FA8C16}
  .op-list{display:flex;flex-direction:column;gap:12px}
  .op-item{display:flex;gap:10px;font-size:13px;color:var(--text-2);position:relative;padding-left:16px}
  .op-item::before{content:"";position:absolute;left:2px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--head);border:1px solid #C7CBD4}
  .op-item .op-time{flex:none;color:var(--text-3)}
  .action-bar{
    display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--border);background:#FAFBFC;box-shadow:0 2px 6px rgba(5,12,50,.05);flex:none;
  }
  .action-bar .btn-primary,
  .action-bar .btn-default{width:32px;height:32px;padding:0;justify-content:center;font-size:0;gap:0}
  .action-bar .btn-primary .icon,
  .action-bar .btn-default .icon{width:18px;height:18px}
  .action-bar .dropdown-trigger{min-width:0;padding:0}
  .action-bar .dropdown-trigger .caret{display:none}
  .btn-primary{height:36px;padding:0 18px;border-radius:var(--radius);background:var(--primary);color:#fff;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
  .btn-primary:hover{opacity:.9}
  .btn-default{height:36px;padding:0 16px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;font-size:14px;display:inline-flex;align-items:center;gap:6px}
  .btn-default:hover{border-color:var(--primary);color:var(--primary)}
  .btn-more-menu{margin-left:auto}
  .btn-back{height:34px;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text)}
  .btn-back:hover{color:var(--primary);border-color:var(--primary)}

  /* tasks */
  .task-list{display:flex;flex-direction:column;gap:10px}
  .task-card{
    display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);
    padding:14px 16px;cursor:pointer;transition:box-shadow .15s,border-color .15s;
  }
  .task-card:hover{border-color:#C7CBD4;box-shadow:var(--shadow)}
  .prio{width:30px;height:30px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex:none}
  .prio.high{background:#FFE4E4;color:var(--primary)}
  .prio.mid{background:#FFF1E8;color:var(--orange)}
  .prio.low{background:#E8F7EE;color:var(--green)}
  .task-main{flex:1;min-width:0}
  .task-title{font-weight:600;font-size:14px;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .task-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--text-2)}
  .task-meta span{display:inline-flex;align-items:center;gap:5px}
  .task-meta .icon{width:13px;height:13px;color:var(--text-3)}
  .task-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}

  /* settings */
  .settings-layout{display:flex;gap:14px;flex:1;min-height:0}
  .settings-left{width:340px;flex:none;background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow-y:auto}
  .settings-right{flex:1;min-width:0;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;overflow-y:auto}
  .accordion{border-bottom:1px solid #F0F1F4}
  .accordion-head{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;font-size:14px;font-weight:600}
  .accordion-head:hover{background:#FAFBFC}
  .accordion-head .count{font-size:12px;color:var(--text-2);font-weight:400}
  .accordion-head .arrow{margin-left:auto;color:var(--text-3);transition:transform .15s}
  .accordion.open .accordion-head .arrow{transform:rotate(90deg)}
  .accordion-body{display:none;padding:0 16px 12px}
  .accordion.open .accordion-body{display:block}
  .setting-row{
    display:flex;align-items:center;gap:12px;height:46px;border-top:1px solid #F5F6F8;font-size:13px;cursor:pointer;padding:0 4px;
  }
  .setting-row:hover{background:#FAFBFC}
  .setting-row .s-name{flex:1}
  .setting-row .s-auth{color:var(--text-2);font-size:12.5px}
  .mini-switch{display:inline-block;width:32px;height:18px;border-radius:9px;background:#C7CBD4;position:relative;flex:none;cursor:pointer}
  .mini-switch::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .15s}
  .mini-switch.on{background:var(--primary)}
  .mini-switch.on::after{left:16px}
  .auth-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

function buildEvents(){
  const events = [];
  let id = 1000;
  const perCat = {equip:12, maintain:1, location:2, fuel:3, inspect:1};
  CATEGORIES.forEach((cat,ci)=>{
    const n = perCat[cat.key] || 1;
    for(let i=0;i<n;i++){
      const type = EVENT_TYPES[cat.key][i % EVENT_TYPES[cat.key].length];
      const dev = DEVICES[(ci + i) % DEVICES.length];
      const hoursAgo = ci*6 + i*4 + (id % 3);
      const d = new Date(TIME_BASE - hoursAgo*3600*1000);
      const status = STATUS[(id + i) % 3];
      events.push({
        id:'EVT-'+id, deviceId:dev.id, deviceName:dev.name, deviceType:dev.type, project:dev.project,
        cat:cat.key, type, content:EVENT_CONTENT[type],
        time:fmt(d), status,
        handler: status==='待处理' ? '' : PEOPLE[(id+i)%4],
        handleTime: status==='待处理' ? '' : fmt(new Date(d.getTime()+7200*1000))
      });
      id++;
    }
  });
  return events;
}
function fmt(d){
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

const DD = {};
function makeDropdown(containerId, opts){
  const wrap = document.createElement('div');
  wrap.className = 'dropdown';
  wrap.innerHTML = `<button class="dropdown-trigger"><span class="d-label">${opts.label}</span><span class="caret">${icon('chevronDown')}</span></button>
    <div class="dropdown-menu">${opts.render()}</div>`;
  const d = { wrap, menu: wrap.querySelector('.dropdown-menu'), opts, label: wrap.querySelector('.d-label') };
  DD[containerId] = d;
  bindMenu(d);
  wrap.querySelector('.dropdown-trigger').addEventListener('click', e=>{
    e.stopPropagation();
    const was = wrap.classList.contains('open');
    document.querySelectorAll('.dropdown.open').forEach(x=>x.classList.remove('open'));
    if(!was){ wrap.classList.add('open'); refreshMenu(containerId); }
  });
  wrap.querySelector('.dropdown-menu').addEventListener('click', e=>{ e.stopPropagation(); });
  document.getElementById(containerId).appendChild(wrap);
  return d;
}
function bindMenu(d){
  d.menu.querySelectorAll('[data-opt]').forEach(o=>{
    o.addEventListener('click',()=>{
      d.opts.onClick(o.dataset.opt);
      d.label.textContent = d.opts.labelText();
      d.opts.onPick && d.opts.onPick();
    });
  });
  d.menu.querySelectorAll('[data-clear]').forEach(o=>{
    o.addEventListener('click',()=>{
      d.opts.onClear && d.opts.onClear();
      d.label.textContent = d.opts.labelText();
      d.opts.onPick && d.opts.onPick();
    });
  });
  if(d.opts.onApply){
    d.menu.querySelectorAll('[data-apply]').forEach(o=>{
      o.addEventListener('click',()=>{
        d.opts.onApply(d.menu);
        d.label.textContent = d.opts.labelText();
        d.opts.onPick && d.opts.onPick();
      });
    });
  }
}
function refreshMenu(id){
  const d = DD[id]; if(!d) return;
  d.menu.innerHTML = d.opts.render();
  bindMenu(d);
}

/* ============ Filtering ============ */
function filteredEvents(){
  return EVENTS.filter(e=>{
    if(e.cat!==currentCat) return false;
    if(filters.status.length && !filters.status.includes(e.status)) return false;
    if(filters.type.length && !filters.type.includes(e.type)) return false;
    if(filters.deviceType.length && !filters.deviceType.includes(e.deviceType)) return false;
    const day = e.time.slice(0,10);
    if(filters.startDate && day < filters.startDate) return false;
    if(filters.endDate && day > filters.endDate) return false;
    const kw = filters.kw.trim();
    if(kw && !(e.deviceName.includes(kw)||e.type.includes(kw)||e.content.includes(kw))) return false;
    return true;
  }).sort((a,b)=>b.time.localeCompare(a.time));
}

  document.getElementById('filterCount').textContent = `${filteredEvents().length} 条`;
  renderTable();
}

function openCurve(mode){

function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31 + s.charCodeAt(i))|0; } return Math.abs(h); }
function curveSeries(points){
  const seed = hashStr(activeEvent.id + activeMetric);
  const base = activeCurveMode==='oil' ? 55 + (seed%20) : 65 + (seed%30);
  const amp = activeCurveMode==='oil' ? 6 + (seed%8) : 8 + (seed%12);
  return Array.from({length:points},(_,i)=>{
    const wave = Math.sin(i/3 + (seed%7)) * amp;
    const spike = (seed % 5 === i % 5) ? amp*1.5 : 0;
    return Math.round((base + wave + spike)*10)/10;
  });
}
function curveThreshold(){
  if(activeMetric==='油位（%）') return 15;
  if(activeMetric.includes('电压')) return 24;
  if(activeMetric.includes('转速')) return 2200;
  if(activeMetric.includes('载荷')) return 30;
  if(activeMetric.includes('水温')||activeMetric.includes('油温')||activeMetric.includes('电机温度')) return 95;
  if(activeMetric.includes('绝缘')) return 0.5;
  if(activeMetric.includes('负载')) return 85;
  return 80;
}
function fmtShort(d){ const p=n=>String(n).padStart(2,'0'); return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function parseTime(s){ return new Date(s.replace(' ','T')); }
function curveRange(){
  const t = parseTime(activeEvent.time);
  return { start: new Date(t.getTime() - 12*3600*1000), end: new Date(t.getTime() + 12*3600*1000) };
}
function renderCurvePage(){
  const page = document.getElementById('curvePage');
  const dev = DEVICES.find(d=>d.id===activeEvent.deviceId);

        <div class="curve-meta">
          <span class="cm">${icon('calendar')}${fmtShort(start)} ~ ${fmtShort(end)}</span>
          <span class="cm">${icon('target')}围栏：港区堆场</span>
          <span class="cm">${icon('alert')}出圈</span>
        </div>
      </div>
      <div class="curve-cards">
        <div class="curve-card"><div class="k">触发位置</div><div class="v warn">东门出口</div></div>
        <div class="curve-card"><div class="k">出圈时间</div><div class="v" style="font-size:15px">${activeEvent.time}</div></div>
        <div class="curve-card"><div class="k">围栏名称</div><div class="v">港区堆场</div></div>
      </div>
      <div class="curve-chart-wrap">
        <div class="curve-chart">${locationSvg()}</div>
        <div class="curve-legend">
          <span class="legend-line"><i style="background:var(--link)"></i>轨迹</span>

        </div>
      </div>`;
    return;
  }
  const series = curveSeries(24);
  const thr = curveThreshold();
  const max = Math.max(...series, thr) * 1.08;
  const min = Math.min(...series) * 0.9;
  const unit = METRIC_UNIT[activeMetric] || '';
  const metrics = activeCurveMode==='oil' ? ['油位（%）'] : (DEVICE_CURVE_METRICS[dev.type]||DEVICE_CURVE_METRICS['半挂牵引车']);
  const maxVal = Math.max(...series);

  page.innerHTML = `

      <div class="curve-meta">
        <span class="cm">${icon('calendar')}${fmtShort(start)} ~ ${fmtShort(end)}</span>
        <span class="cm">${icon('target')}30 分钟粒度</span>
        <span class="cm">${icon('alert')}警戒线 ${thr} ${unit}</span>
      </div>
    </div>

      <span class="tl">指标切换</span>

    </div>

      <div class="curve-card"><div class="k">当前值</div><div class="v ${last>=thr?'warn':'ok'}">${last}<span class="u">${unit}</span></div></div>
    </div>
    <div class="curve-chart-wrap">
      <div class="curve-chart">${curveSvg(series, thr, min, max, unit)}</div>
      <div class="curve-legend">
        <span class="legend-line"><i></i>${activeMetric}</span>
        <span class="legend-line"><i class="red"></i>红色警戒线 ${thr} ${unit}</span>
        <span class="curve-track-note">PC 端统一跳转设备管理-设备详情页，不在审核模块内嵌曲线</span>
      </div>
    </div>`;
  const sel = document.getElementById('curveMetricSelect');
  if(sel) sel.addEventListener('change',()=>{ activeMetric = sel.value; renderCurvePage(); });
}
function curveSvg(series, thr, min, max, unit){
  const W=760, H=260, L=46, R=16, T=16, B=28;
  const iw = W-L-R, ih = H-T-B;
  const x = i => L + i*(iw/(series.length-1));
  const y = v => T + ih - ((v-min)/(max-min))*ih;
  const grid = [0,1,2,3,4].map(k=>{
    const gy = T + ih*k/4;
    const val = max - (max-min)*k/4;
    return `<line x1="${L}" y1="${gy.toFixed(1)}" x2="${W-R}" y2="${gy.toFixed(1)}" stroke="#F0F1F4"/><text x="${L-6}" y="${(gy+4).toFixed(1)}" text-anchor="end" font-size="11" fill="#9AA0A6">${val.toFixed(1)}</text>`;
  }).join('');
  const pts = series.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const thrY = y(thr);
  const time = curveRange();
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    ${grid}
    <line x1="${L}" y1="${thrY.toFixed(1)}" x2="${W-R}" y2="${thrY.toFixed(1)}" stroke="var(--primary)" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="${W-R-4}" y="${(thrY-6).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--primary)">警戒线 ${thr} ${unit}</text>
    <polyline points="${pts}" fill="none" stroke="var(--link)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="${L}" y="${H-8}" font-size="11" fill="#9AA0A6">${fmtShort(time.start)}</text>
    <text x="${W-R}" y="${H-8}" text-anchor="end" font-size="11" fill="#9AA0A6">${fmtShort(time.end)}</text>
  </svg>`;
}
function locationSvg(){
  const W=760, H=260;
  const pts = [[60,210],[150,180],[240,190],[330,150],[420,120],[510,90]];
  const d = pts.map((p,i)=>`${i?'L':'M'}${p[0]} ${p[1]}`).join(' ');
  const dots = pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?6:4}" fill="${i===pts.length-1?'var(--primary)':'var(--link)'}"/>`).join('');
  const fence = `<ellipse cx="380" cy="170" rx="230" ry="90" fill="none" stroke="var(--orange)" stroke-width="1.5" stroke-dasharray="8 5"/><text x="380" y="164" text-anchor="middle" font-size="11" fill="var(--orange)">港区堆场围栏</text>`;
  const gridV = Array.from({length:12},(_,i)=>`<line x1="${i*70}" y1="0" x2="${i*70}" y2="${H}" stroke="#ECEEF2"/>`).join('');
  const gridH = Array.from({length:5},(_,i)=>`<line x1="0" y1="${i*65}" x2="${W}" y2="${i*65}" stroke="#ECEEF2"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    <rect x="0" y="0" width="${W}" height="${H}" fill="#F7F8FA"/>
    ${gridV}
    ${gridH}
    ${fence}
    <path d="${d}" fill="none" stroke="var(--link)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    <text x="${pts[0][0]+8}" y="${pts[0][1]-8}" font-size="11" fill="#9AA0A6">起点</text>
    <text x="${pts[pts.length-1][0]-70}" y="${pts[pts.length-1][1]-10}" font-size="11" fill="var(--primary)">出圈点</text>
  </svg>`;
}

      <div class="detail-grid">
        <div class="kv2"><span class="k">状态</span><span class="v">${statusTag(t.status==='待处理'?'待处理':t.status==='处理中'?'待处理':'已处理')}</span></div>
        <div class="kv2"><span class="k">优先级</span><span class="v">${t.prio}</span></div>
        <div class="kv2"><span class="k">计划开始时间</span><span class="v">${t.start}</span></div>
        <div class="kv2"><span class="k">截止时间</span><span class="v">${t.due}</span></div>
        <div class="kv2"><span class="k">任务类型</span><span class="v">${t.type}</span></div>
        <div class="kv2"><span class="k">任务描述</span><span class="v">${t.desc}</span></div>
      </div>
    </div>
    <div class="detail-section">
      <div class="sec-title">${icon('task')}关联审核事件</div>
      <div class="detail-grid">
        <div class="kv2"><span class="k">事件类型</span><span class="v">${activeEvent?activeEvent.type:'油位低'}</span></div>
        <div class="kv2"><span class="k">关联设备</span><span class="v">${t.device.split(' · ')[0]}</span></div>
        <div class="kv2"><span class="k">发生时间</span><span class="v">${activeEvent?activeEvent.time:'2026-08-02 03:12:45'}</span></div>
      </div>
    </div>
    <div class="detail-section">
      <div class="sec-title">${icon('doc')}任务动态</div>
      <div class="op-list">
        <div class="op-item"><span>${t.creator} 创建任务</span><span class="op-time">${t.created}</span></div>
        <div class="op-item"><span>通知人员：${t.notice}</span></div>
      </div>
    </div>`;
}

/* ============ Settings ============ */
const SETTING_DATA = {
  equip:{on:12, total:15, types:EVENT_TYPES.equip},
  maintain:{on:1, total:1, types:EVENT_TYPES.maintain},
  location:{on:1, total:1, types:EVENT_TYPES.location},
  fuel:{on:3, total:3, types:EVENT_TYPES.fuel},
  inspect:{on:1, total:1, types:EVENT_TYPES.inspect}
};
function renderSettings(){
  const acc = document.getElementById('settingsAccordion');
  const d = SETTING_DATA;
  acc.innerHTML = CATEGORIES.map((c,i)=>{
    const s = d[c.key];
    return `<div class="accordion${i===0?' open':''}" data-acc="${c.key}">
      <div class="accordion-head"><span class="icon" data-icon="${c.icon}"></span>${c.name}<span class="count">${s.on}/${s.total}</span><span class="arrow">${icon('chevronRight')}</span></div>
      <div class="accordion-body">
        ${s.types.map(t=>`<div class="setting-row" data-type="${t}"><span class="s-name">${t}</span><span class="s-auth">授权人员：全部用户</span><span class="mini-switch on" data-sw="${t}"></span></div>`).join('')}
      </div>
    </div>`;
  }).join('');
  acc.querySelectorAll('[data-icon]').forEach(n=>{n.innerHTML=icon(n.dataset.icon);});
  acc.querySelectorAll('.accordion-head').forEach(h=>{
    h.addEventListener('click',()=>{
      const a = h.parentElement;
      const open = a.classList.toggle('open');
      document.querySelectorAll('.accordion').forEach(x=>{ if(x!==a) x.classList.remove('open'); });
      h.querySelector('.arrow').innerHTML = icon('chevronRight');
    });
  });
  acc.querySelectorAll('.setting-row').forEach(r=>{
    r.addEventListener('click',()=>{
      const name = r.querySelector('.s-name').textContent;
      document.getElementById('settingsDetail').innerHTML = `
        <div class="d-title" style="font-size:15px;font-weight:600;margin-bottom:4px">${name}</div>
        <div style="font-size:12.5px;color:var(--text-2);margin-bottom:18px">企业/代理商租户 · 授权人员配置</div>
        <div class="kv"><span class="k">授权全部用户</span><span class="v"><span class="mini-switch on" data-sw="all"></span></span></div>
        <div id="specUserBlock" hidden>
          <div class="kv" style="align-items:flex-start"><span class="k">指定用户</span><span class="v">已选 ${selectedUsers.length} 人</span></div>
          <div class="auth-grid" id="authGrid"></div>
          <div style="margin-top:10px"><button class="link-btn" id="btnPickUsers"><span class="icon sm" data-icon="plus"></span>选择人员</button></div>
        </div>
        <div class="kv" style="margin-top:18px"><span class="k">保存生效</span><span class="v">保存后立即生效，对未来新事件生效</span></div>
        <div class="settings-foot">
          <button class="btn-primary" data-save>保存</button>
          <button class="btn-default" data-cancel>取消</button>
        </div>`;
      renderAuthGrid();
      bindSettingsRight();
    });
  });
  bindSwitchToggles();
}
function renderAuthGrid(){
  const grid = document.getElementById('authGrid'); if(!grid) return;
  grid.innerHTML = selectedUsers.map(u=>{
    const uu = USER_POOL.find(x=>x.name===u) || {name:u, contact:''};
    return `<span class="auth-chip">${uu.name} ${uu.contact}<span class="x" data-rm="${u}">${icon('x')}</span></span>`;
  }).join('');
  grid.querySelectorAll('[data-rm]').forEach(x=>{
    x.addEventListener('click',()=>{
      selectedUsers = selectedUsers.filter(n=>n!==x.dataset.rm);
      renderAuthGrid(); updateAuthCount();
    });
  });
}
function updateAuthCount(){
  const kv = [...document.querySelectorAll('#settingsDetail .kv')].find(el=>el.textContent.includes('指定用户'));
  if(kv) kv.querySelector('.v').textContent = `已选 ${selectedUsers.length} 人`;
}
function openUserPicker(){
  pickTemp = [...selectedUsers];
  document.getElementById('userSearch').value = '';
  renderUserList();
  document.getElementById('modalUsers').classList.add('show');
}
function renderUserList(){
  const kw = (document.getElementById('userSearch').value||'').trim();
  const el = document.getElementById('userList');
  const list = USER_POOL.filter(u=>!kw||u.name.includes(kw)||u.contact.includes(kw));
  el.innerHTML = list.map(u=>`
    <div class="user-opt${pickTemp.includes(u.name)?' on':''}" data-user="${u.name}">
      <span class="check">${pickTemp.includes(u.name)?icon('check'):''}</span>
      <span class="u-name">${u.name}</span>
      <span class="u-contact">${u.contact}</span>
    </div>`).join('') || `<div class="empty" style="padding:30px 0">${icon('search')}<span>无匹配人员</span></div>`;
  el.querySelectorAll('.user-opt').forEach(o=>{
    o.addEventListener('click',()=>{
      const n = o.dataset.user;
      pickTemp.includes(n)?pickTemp=pickTemp.filter(x=>x!==n):pickTemp.push(n);
      renderUserList();
    });
  });
}
function bindSwitchToggles(){
  document.querySelectorAll('[data-sw]').forEach(s=>{
    s.addEventListener('click',e=>{
      e.stopPropagation();
      s.classList.toggle('on');
      toast(s.classList.contains('on')?'已开启，新事件将进入审核列表':'已关闭，关闭后新事件不进入审核列表，已有事件不受影响');
    });
  });
}
function bindSettingsRight(){
  const pick = document.getElementById('btnPickUsers');
  if(pick) pick.addEventListener('click',openUserPicker);
  document.querySelectorAll('[data-sw="all"]').forEach(s=>{
    s.addEventListener('click',()=>{
      const on = s.classList.toggle('on');
      const block = document.getElementById('specUserBlock');
      if(block) block.hidden = on;
      toast(on?'已开启授权全部用户，指定用户配置隐藏':'已关闭授权全部用户，可指定授权人员');
    });
  });
  const save = document.querySelector('[data-save]');
  if(save) save.addEventListener('click',()=>{
    toast('保存成功');
    switchView('viewList');
  });
  const cancel = document.querySelector('[data-cancel]');
  if(cancel) cancel.addEventListener('click',()=>toast('已取消，未保存修改'));
}

/* ============ View switching ============ */
function switchView(id){
  document.querySelectorAll('.view').forEach(v=>v.hidden = true);
  document.getElementById(id).hidden = false;
}

/* ============ Modals / toast ============ */
function openModal(id){
  document.getElementById(id).classList.add('show');
}
function closeModals(){
  document.querySelectorAll('.modal-mask.show').forEach(m=>m.classList.remove('show'));
}
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeModals));
document.querySelectorAll('.modal-mask').forEach(m=>{
  m.addEventListener('click',e=>{ if(e.target===m) closeModals(); });
});
document.getElementById('userSearch').addEventListener('input',renderUserList);
document.getElementById('userConfirm').addEventListener('click',()=>{
  selectedUsers = [...pickTemp];
  closeModals();
  renderAuthGrid(); updateAuthCount();
  toast('已更新授权人员');
});
function fillPhrases(el, arr){
  el.innerHTML = arr.map(p=>`<button class="phrase" data-p="${p}">${p}</button>`).join('');
  el.querySelectorAll('.phrase').forEach(b=>{
    b.addEventListener('click',()=>{
      b.classList.toggle('on');
      const ta = el.parentElement.querySelector('textarea');
      const vals = [...el.querySelectorAll('.phrase.on')].map(x=>x.dataset.p).join('；');
      ta.value = vals;
    });
  });
}
fillPhrases(document.getElementById('handlePhrases'), ['已安排检修','现场确认正常','复测正常']);
fillPhrases(document.getElementById('ignorePhrases'), ['非本设备问题','重复预警','阈值误报']);

let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toastText').textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ============ Events wiring ============ */
document.getElementById('logoHome').addEventListener('click',()=>{
  hideDetailPanel();
  switchView('viewList'); renderCategories(); renderTable();
});
document.getElementById('btnSettings').addEventListener('click',()=>{
  hideDetailPanel();
  renderSettings(); switchView('viewSettings');
});
document.getElementById('btnRefresh').addEventListener('click',()=>{
  const now = new Date();
  document.getElementById('lastUpdated').textContent = `最后更新 ${now.getMonth()+1}/${now.getDate()}/${now.getFullYear()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  toast('已刷新当前大类数据');
});
document.getElementById('modeSwitch').addEventListener('click',()=>{
  grouped = !grouped;
  document.getElementById('modeSwitch').classList.toggle('on',grouped);
  renderTable();
});
document.getElementById('searchInput').addEventListener('input',e=>{filters.kw=e.target.value; applyFilters();});
document.getElementById('taskSearch').addEventListener('input',renderTasks);
document.getElementById('btnHandle').addEventListener('click',()=>{
  if(activeEvent.cat==='maintain'){ toast('原型演示：进入设备保养详情页，提供自行保养 / 预约保养'); return; }
  openModal('modalHandle');
});
document.getElementById('handleSubmit').addEventListener('click',()=>{
  closeModals(); activeEvent.status='已处理'; activeEvent.handler='张三'; activeEvent.handleTime=fmt(new Date());
  toast('操作成功');
  renderTable(); renderCategories();
  refreshActionBar(); renderMoreMenu(); renderDetailBody();
});
document.getElementById('ignoreSubmit').addEventListener('click',()=>{
  closeModals(); activeEvent.status='已忽略'; activeEvent.handler='张三'; activeEvent.handleTime=fmt(new Date());
  toast('操作成功');
  renderTable(); renderCategories();
  refreshActionBar(); renderMoreMenu(); renderDetailBody();
});
document.getElementById('btnTasks').addEventListener('click',()=>{renderTasks(); showPanel('panelTasks');});
document.getElementById('btnCloseDetail').addEventListener('click',hideDetailPanel);
document.getElementById('panelMask').addEventListener('click',hideDetailPanel);
document.getElementById('btnBackCurve').addEventListener('click',closeCurve);
document.getElementById('btnBackList2').addEventListener('click',()=>{
  hideDetailPanel();
  switchView('viewList');
});
document.getElementById('btnBackDetail').addEventListener('click',()=>{
  showPanel('panelDetail');
  renderDetailBody();
});
document.getElementById('btnBackTasks').addEventListener('click',()=>{renderTasks(); showPanel('panelTasks');});

/* ============ Init ============ */
renderSidebar();
renderCategories();
initFilters();
initMore();
updateListTitle();
applyFilters();
</script>
</body>
</html>
